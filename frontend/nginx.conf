server {
    listen       80;
    server_name  localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://backend:8080 http://localhost:8080 http://otel-collector:4318; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy OTLP traces to the otel-collector to avoid CORS
    location /v1/traces {
        proxy_pass http://otel-collector:4318/v1/traces;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type application/json;
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
