db {
  url = ${?DB_URL}
  url = "jdbc:postgresql://localhost:5432/chat_app"
  # Runtime application user — DML only (SELECT, INSERT, UPDATE, DELETE).
  # Maps to env var DB_USER / DB_PASSWORD.
  user = ${?DB_USER}
  user = "chat_app_app"
  password = ${?DB_PASSWORD}
  password = "change-this-app-password"
  # Migration user — DDL owner, used only by Flyway at startup.
  # Maps to env var DB_MIGRATION_USER / DB_MIGRATION_PASSWORD.
  # Falls back to db.user / db.password when not set (useful for local dev
  # without a split setup).
  migrationUser = ${?DB_MIGRATION_USER}
  migrationPassword = ${?DB_MIGRATION_PASSWORD}
}

http {
  host = "0.0.0.0"
  port = 8080
}

# OAuth 2.0 + OIDC configuration for social login providers.
# Each provider requires clientId, clientSecret, and endpoint URIs.
# For local development without a configured provider, leave oauth empty or configure test values.
oauth {
  # Example GitHub OAuth configuration (requires GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET env vars):
  # github {
  #   clientId = ${?GITHUB_OAUTH_CLIENT_ID}
  #   clientSecret = ${?GITHUB_OAUTH_CLIENT_SECRET}
  #   authorizationUri = "https://github.com/login/oauth/authorize"
  #   tokenUri = "https://github.com/login/oauth/access_token"
  #   userInfoUri = "https://api.github.com/user"
  # }
}

logging {
  level = "INFO"
}

metrics {
  enabled = true
}

tracing {
  enabled = true
}