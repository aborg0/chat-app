services:
  postgres:
    image: postgres:18.3-alpine
    container_name: chat-app-postgres
    environment:
      POSTGRES_DB: chat_app
      # Migration / schema-owner user — has DDL rights, used by Flyway.
      POSTGRES_USER: ${DB_MIGRATION_USER:-chat_app_migration}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-change-this-migration-password}
      # Restricted runtime user — DML only, created by init.sql.
      DB_APP_USER: ${DB_APP_USER:-chat_app_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-change-this-app-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_MIGRATION_USER:-chat_app_migration} -d chat_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: chat-app-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/collector-config.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: chat-app-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    container_name: chat-app-loki
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: chat-app-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: chat-app-grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-admin-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  backend:
    image: ${BACKEND_IMAGE:-localhost/chat-app-backend:latest}
    container_name: chat-app-backend
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chat_app
      # Runtime application user — DML only.
      DB_USER: ${DB_APP_USER:-chat_app_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:-change-this-app-password}
      # Migration user — used by Flyway at startup.
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-chat_app_migration}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-change-this-migration-password}
      OTEL_SERVICE_NAME: chat-app-backend
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=chat-app
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    container_name: chat-app-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/resources:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
